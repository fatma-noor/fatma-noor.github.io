name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Generate sharing metadata from content
        run: node tools/generate_social_meta.cjs
      - name: Package public static files
        run: |
          mkdir _site
          cp index.html experience.html projects.html contact.html style.css app.js theme.js content.json _site/
          mkdir -p _site/images/web
          cp images/og-preview.png _site/images/
          cp images/web/*-[0-9]*.webp _site/images/web/
          cp -R images/icons images/logos _site/images/
          cp -R fonts vendor _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
